name: Build and Test

# 常规质量门禁：每次 push 到 master 或 PR 时构建整个解决方案并跑测试，
# 提前拦截编译/回归问题（发布仍由 release.yml 的 tag 触发）。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build ToDo.slnx -c Debug

      - name: Test
        run: dotnet test ToDo.slnx -c Debug --no-build
