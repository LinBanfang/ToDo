name: Build and Release

# 触发方式：
#   git tag v1.0.0 && git push origin v1.0.0   → 自动构建并发布 GitHub Release
#   或在 GitHub Actions 页面手动 "Run workflow"（workflow_dispatch 填 tag 可重跑）
# Gitee 镜像（tag / 正文 / zip 附件）不在 CI 同步，由 Claude 手动完成（见 docs/gitee-mirror.md）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.2.2）。push tag 触发时留空即可。'
        required: false
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 GitHub Release 需要写权限
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v\d') { throw "无法解析发布 tag：'$tag'。请 push v* tag，或在手动运行时填写 tag 输入。" }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (self-contained win-x64)
        run: dotnet publish ToDo/ToDo.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Package zip
        run: Compress-Archive -Path publish/* -DestinationPath "ToDo-${{ env.RELEASE_TAG }}.zip"

      # Release body comes from the matching CHANGELOG section (## [v1.2.3]), so the
      # description follows the curated changelog instead of auto-generated PR noise.
      # 正文仅用于 GitHub Release；Gitee 镜像由 Claude 手动同步（见 docs/gitee-mirror.md）。
      - name: Extract changelog for release body
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $pattern = '^## \[' + [regex]::Escape($tag) + '\]'
          $lines = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md')
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $pattern) { $start = $i; break }
          }
          if ($start -lt 0) {
            Write-Host "CHANGELOG has no section for $tag — using generic body"
            Set-Content -Path release-body.md -Value "Release $tag" -Encoding utf8
          } else {
            $body = New-Object System.Collections.Generic.List[string]
            for ($i = $start; $i -lt $lines.Count; $i++) {
              if ($i -gt $start -and $lines[$i] -match '^## \[v') { break }
              $body.Add($lines[$i])
            }
            Set-Content -Path release-body.md -Value (($body -join "`n").Trim()) -Encoding utf8
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: |
            ToDo-${{ env.RELEASE_TAG }}.zip
            release-body.md
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ToDo-${{ env.RELEASE_TAG }}.zip
          body_path: release-body.md
          update_release: true # 重跑同 tag 时更新而非报错

