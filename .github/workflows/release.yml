name: Build and Release

# 触发方式：
#   git tag v1.0.0 && git push origin v1.0.0   → 自动构建并发布
#   或在 GitHub Actions 页面手动 "Run workflow"（workflow_dispatch 填 tag 可重跑 / 补同步）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布 / 同步的 tag（如 v1.2.2）。push tag 触发时留空即可。'
        required: false
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 GitHub Release 需要写权限
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v\d') { throw "无法解析发布 tag：'$tag'。请 push v* tag，或在手动运行时填写 tag 输入。" }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (self-contained win-x64)
        run: dotnet publish ToDo/ToDo.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Package zip
        run: Compress-Archive -Path publish/* -DestinationPath "ToDo-${{ env.RELEASE_TAG }}.zip"

      # Release body comes from the matching CHANGELOG section (## [v1.2.3]), so the
      # description follows the curated changelog instead of auto-generated PR noise.
      # Extracted before the artifact upload so the same body feeds both the GitHub Release
      # and the Gitee mirror release.
      - name: Extract changelog for release body
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $pattern = '^## \[' + [regex]::Escape($tag) + '\]'
          $lines = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md')
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $pattern) { $start = $i; break }
          }
          if ($start -lt 0) {
            Write-Host "CHANGELOG has no section for $tag — using generic body"
            Set-Content -Path release-body.md -Value "Release $tag" -Encoding utf8
          } else {
            $body = New-Object System.Collections.Generic.List[string]
            for ($i = $start; $i -lt $lines.Count; $i++) {
              if ($i -gt $start -and $lines[$i] -match '^## \[v') { break }
              $body.Add($lines[$i])
            }
            Set-Content -Path release-body.md -Value (($body -join "`n").Trim()) -Encoding utf8
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: |
            ToDo-${{ env.RELEASE_TAG }}.zip
            release-body.md
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ToDo-${{ env.RELEASE_TAG }}.zip
          body_path: release-body.md
          update_release: true # 重跑同 tag 时更新而非报错

  # Gitee 镜像独立成 job：Gitee API 偶发 DNS / 网络抖动时，可在 Actions 页面
  # 对本 job 单独 "Re-run failed jobs"，无需重跑构建与 GitHub Release。
  gitee:
    runs-on: windows-latest
    needs: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: .

      - name: Sync release to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $owner = 'wu-bin-921'
          $repo = 'ToDo'
          $base = "https://gitee.com/api/v5/repos/$owner/$repo"
          $token = $env:GITEE_TOKEN

          # Gitee 偶发 "No such host is known"（DNS 抖动）：指数退避重试吸收瞬时故障
          function Invoke-Gitee {
            param([string]$Method, [string]$Uri, [hashtable]$Body = @{}, [hashtable]$Form, [int]$MaxRetries = 5)
            $delay = 3
            for ($i = 1; $i -le $MaxRetries; $i++) {
              try {
                if ($Form) { return Invoke-RestMethod -Method $Method -Uri $Uri -Form $Form -ErrorAction Stop }
                # Invoke-RestMethod 只对 POST 自动设置 form-urlencoded；PATCH/PUT 不带 body 时
                # Content-Type 为空，Gitee 会拒绝并返回 406。非空 body 显式指定（GET 无 body 不走此分支）。
                if ($Body -and $Body.Count -gt 0) {
                    return Invoke-RestMethod -Method $Method -Uri $Uri -Body $Body -ContentType 'application/x-www-form-urlencoded' -ErrorAction Stop
                }
                return Invoke-RestMethod -Method $Method -Uri $Uri -Body $Body -ErrorAction Stop
              } catch {
                Write-Host "Gitee 调用失败(第 $i/$MaxRetries 次): $($_.Exception.Message)"
                $detail = $_.ErrorDetails.Message
                if ($detail) { Write-Host "  响应详情: $detail" }
                if ($i -eq $MaxRetries) { throw }
                Start-Sleep -Seconds $delay
                $delay *= 2
              }
            }
          }

          # 1. Ensure the tag exists on Gitee (release creation requires it)
          try {
            Invoke-Gitee -Method Post -Uri "$base/tags?access_token=$token" -Body @{ tag_name = $tag; refs = 'master' } | Out-Null
            Write-Host "Created Gitee tag $tag"
          } catch {
            Write-Host "Gitee tag $tag already exists or create failed: $($_.ErrorDetails.Message)"
          }

          # 2. Create the release with the CHANGELOG-derived body (Gitee expects form-encoded
          #    params; "body" is required). Re-runs on an existing tag fail here — that's fine,
          #    step 4 patches the existing release.
          $releaseBody = Get-Content -Raw -Encoding UTF8 release-body.md
          if (-not $releaseBody) { $releaseBody = "Release $tag" }
          try {
            Invoke-Gitee -Method Post -Uri "$base/releases?access_token=$token" -Body @{
              tag_name = $tag
              name = "Release $tag"
              body = $releaseBody
              target_commitish = 'master'
            } | Out-Null
            Write-Host "Created Gitee release $tag"
          } catch {
            Write-Host "Gitee release $tag create failed (可能已存在): $($_.ErrorDetails.Message)"
          }

          # 3. Find the release id by listing releases and matching the tag
          # (Gitee's releases/tags/{tag} returns null when called with a token)
          Start-Sleep -Seconds 2
          $releases = Invoke-Gitee -Method Get -Uri "$base/releases?access_token=$token&per_page=100"
          $match = $releases | Where-Object { $_.tag_name -eq $tag }
          if (-not $match) { throw "No Gitee release for tag $tag in releases list" }
          $id = $match.id
          Write-Host "Found Gitee release id $id for $tag"

          # 4. Always refresh the release body from the CHANGELOG (idempotent — also fixes
          #    releases created before this step read the changelog, like the current v1.2.3)
          Invoke-Gitee -Method Patch -Uri "$base/releases/$id?access_token=$token" -Body @{
            name = "Release $tag"
            body = $releaseBody
          } | Out-Null
          Write-Host "Updated Gitee release $tag body from CHANGELOG"

          # 5. Upload the zip asset
          # Gitee 的 attach_files 对 PowerShell 的 Invoke-RestMethod -Form multipart 兼容不佳
          # （此前返回 400 Bad Request），改用 curl.exe -F，与 Gitee 官方文档示例一致。
          $zip = "ToDo-$tag.zip"
          $uploadUri = "$base/releases/$id/attach_files"
          $uploaded = $false
          $delay = 3
          for ($i = 1; $i -le 5; $i++) {
            try {
              $resp = & curl.exe -sS -f -X POST $uploadUri -F "access_token=$token" -F "file=@$zip" 2>&1
              if ($LASTEXITCODE -ne 0) { throw "curl exit code $LASTEXITCODE : $($resp -join ' ')" }
              Write-Host "Uploaded $zip to Gitee release $tag"
              $uploaded = $true
              break
            } catch {
              Write-Host "Gitee 上传失败(第 $i/5 次): $($_.Exception.Message)"
              if ($i -eq 5) { throw }
              Start-Sleep -Seconds $delay
              $delay *= 2
            }
          }
          if (-not $uploaded) { throw "Failed to upload $zip to Gitee release $tag" }
