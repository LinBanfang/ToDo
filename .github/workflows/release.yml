name: Build and Release

# 触发方式：
#   git tag v1.0.0 && git push origin v1.0.0   → 自动构建并发布
#   或在 GitHub Actions 页面手动 "Run workflow"
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 GitHub Release 需要写权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (self-contained win-x64)
        run: dotnet publish ToDo/ToDo.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Package zip
        run: Compress-Archive -Path publish/* -DestinationPath "ToDo-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ToDo-${{ github.ref_name }}.zip
          generate_release_notes: true

      # 同步同一份 zip 到 Gitee（需在仓库配置 GITEE_TOKEN secret，且 tag 已镜像到 Gitee）。
      # 直接用 Gitee API 上传（release-sync 的资产上传有 bug：用原生 FormData 调 getHeaders() 会抛异常且被吞掉）
      - name: Sync release to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $owner = 'wu-bin-921'
          $repo = 'ToDo'
          $base = "https://gitee.com/api/v5/repos/$owner/$repo"
          $token = $env:GITEE_TOKEN

          # 1. Ensure the tag exists on Gitee (release creation requires it)
          try {
            Invoke-RestMethod -Method Post -Uri "$base/tags?access_token=$token" -Body @{ tag_name = $tag; refs = 'master' } -ErrorAction Stop | Out-Null
            Write-Host "Created Gitee tag $tag"
          } catch {
            Write-Host "Gitee tag $tag already exists or create failed: $($_.ErrorDetails.Message)"
          }

          # 2. Create the release (Gitee expects form-encoded params; "body" is required)
          try {
            Invoke-RestMethod -Method Post -Uri "$base/releases?access_token=$token" -Body @{
              tag_name = $tag
              name = "Release $tag"
              body = "Release $tag - https://github.com/LinBanfang/ToDo/releases/tag/$tag"
              target_commitish = 'master'
            } -ErrorAction Stop | Out-Null
            Write-Host "Created Gitee release $tag"
          } catch {
            Write-Host "Gitee release $tag create failed: $($_.ErrorDetails.Message)"
          }

          # 3. Find the release id by listing releases and matching the tag
          # (Gitee's releases/tags/{tag} returns null when called with a token)
          Start-Sleep -Seconds 2
          $releases = Invoke-RestMethod -Method Get -Uri "$base/releases?access_token=$token&per_page=100" -ErrorAction Stop
          $match = $releases | Where-Object { $_.tag_name -eq $tag }
          if (-not $match) { throw "No Gitee release for tag $tag in releases list" }
          $id = $match.id
          Write-Host "Found Gitee release id $id for $tag"

          # 4. Upload the zip asset
          $zip = "ToDo-$tag.zip"
          $form = @{ file = Get-Item $zip }
          $uploadUri = "$base/releases/$id/attach_files?access_token=$token"
          Invoke-RestMethod -Method Post -Uri $uploadUri -Form $form -ErrorAction Stop | Out-Null
          Write-Host "Uploaded $zip to Gitee release $tag"
